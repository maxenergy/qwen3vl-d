# AI Auto-Annotation Tool Configuration
# 完整配置示例文件

# 环境类型: development, production, test
environment: development

# 调试模式
debug: true

# 数据库配置
database:
  host: localhost
  port: 5432
  user: postgres
  password: your_password_here
  database: qwen3vl_db
  pool_size: 20
  max_overflow: 10

# Redis 配置
redis:
  host: localhost
  port: 6379
  db: 0
  password: null  # 如果需要密码则设置
  max_connections: 50

# API 服务器配置
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  reload: true
  cors_origins:
    - http://localhost:3000
    - http://localhost:5173
  request_timeout: 300

# 文件存储配置
storage:
  root: ./storage
  images_dir: images
  datasets_dir: datasets
  models_dir: models
  max_file_size_mb: 100

# AI 模型配置
models:
  # Qwen3-VL 配置
  qwen3vl_api_url: http://192.168.8.147:9292/v1
  qwen3vl_model: qwen3-vl-30b
  qwen3vl_timeout: 60

  # Hunyuan Image 配置
  hunyuan_api_url: http://your-hunyuan-api:8000
  hunyuan_api_key: your_api_key_here
  hunyuan_timeout: 120

# 训练配置
training:
  default_epochs: 100
  default_batch_size: 16
  default_img_size: 640
  default_device: cuda:0
  checkpoint_interval: 10
  early_stopping_patience: 50

# Celery 配置
celery:
  broker_url: null  # 默认使用 Redis URL
  result_backend: null  # 默认使用 Redis URL
  task_time_limit: 3600
  task_soft_time_limit: 3000
  worker_prefetch_multiplier: 4
  worker_max_tasks_per_child: 1000

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: null  # 留空则只输出到控制台
  rotation: "1 day"
  retention: "30 days"
