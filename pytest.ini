[pytest]
# Pytest configuration for AI Auto-Annotation Tool

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.10

# Command line options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=backend
    --cov=qwen3vl_d
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
    requires_gpu: Tests that require GPU
    requires_api: Tests that require external API
    smoke: Smoke tests for quick validation

# Coverage options
[coverage:run]
source = backend,qwen3vl_d
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
