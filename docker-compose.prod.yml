version: '3.8'

# Production Docker Compose Configuration
# This extends docker-compose.yml with production-specific settings

services:
  postgres:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - /var/lib/qwen3vl/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - /var/lib/qwen3vl/redis:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  backend:
    build:
      target: production
    environment:
      ENVIRONMENT: production
      DEBUG: false
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - /var/lib/qwen3vl/storage:/app/storage
      - /var/log/qwen3vl:/app/logs
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  celery-worker:
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - /var/lib/qwen3vl/storage:/app/storage
      - /var/log/qwen3vl:/app/logs
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
      restart_policy:
        condition: on-failure

  frontend:
    build:
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure

  # Nginx Reverse Proxy (Production only)
  nginx:
    image: nginx:alpine
    container_name: qwen3vl-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/qwen3vl/nginx:/var/log/nginx
    networks:
      - qwen3vl-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

networks:
  qwen3vl-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/qwen3vl/postgres
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/qwen3vl/redis
      o: bind
